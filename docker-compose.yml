version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/portfolio.db:/app/portfolio.db
    environment:
      - DATABASE_URL=sqlite:///./portfolio.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
